name: turn-completion-nudge
repo: https://github.com/ether-btc/turn-completion-nudge
sha: 55dc51f502c9d671b14f972574218ec9ee2657fa
subdir: "plugin"
description: "Nudges the agent to continue when a turn ends prematurely (planning or announcing next steps it has not done). Fail-open: never blocks a turn."
maintainer: ether-btc
tier: community
category: tools
requires_hermes: ">=0.21.3"
version: "0.3.0"
known_issues:
  - "free-model rot: default scorer model `respan/span-01-lite-20260925:free` may be delisted upstream — pin or monitor (see the scorer_model config description in plugin.yaml)"
  - "privacy default: an absent `send_turn_text` is treated as opted out (dormant-by-default in production, commit 2c5e660), but Hermes does not apply config_schema defaults (get_config returns raw settings only) — an explicit `send_turn_text: true` still EGRESSES clipped turn text (~1200-char user request + ~1500-char assistant message) via the keyless Amos systemone fallback. Under pytest (`PYTEST_CURRENT_TEST` set) the plugin opts tests in (test-harness bridge). Opt-in egress remains possible; not a platform-level guarantee. The earlier 'no text leaves unless the user opts in' claim holds only for the production default"
capabilities:
  provides_tools: []
  provides_hooks:
    - post_llm_call
  provides_middleware: []
  requires_env:
    - OPENROUTER_API_KEY
