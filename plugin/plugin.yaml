name: turn-completion-nudge
version: "0.3.1"
description: "Nudges the agent to continue when a turn ends prematurely (planning or announcing next steps it has not done). Fail-open: never blocks a turn."
author: "ether-btc"
kind: standalone
requires_hermes: ">=0.21.3"
requires_env:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key for the configured scorer lane (OpenRouter decisions API, https://openrouter.ai/api/alpha/decisions). Read via the Hermes secret scope when available (profile-scoped secrets), else the declared env var — never .env. Optional — when unset or a template/placeholder value, the plugin fails open (no further egress) and, with amos_fallback: true, may use the keyless Amos systemone fallback (a separate opt-in)."
    secret: true
provides_hooks:
  - post_llm_call
config_schema:
  enabled:
    type: bool
    default: true
    label: Enabled
    description: When false the post_llm_call hook no-ops (fail-open bypass).
  send_turn_text:
    type: bool
    default: false
    label: Send turn text for scoring
    description: Scoring sends ONLY the clipped user request (~1200 chars) and final assistant message (~1500 chars) to the chosen scorer endpoint; vendors may retain requests
  threshold:
    type: float
    default: 0.2
    label: Threshold
    description: Score below this value triggers a continuation nudge (0-1).
  timeout_s:
    type: int
    default: 4
    label: Timeout seconds
    description: Per-hop scorer timeout in seconds.
  scorer_model:
    type: str
    default: respan/span-01-lite-20260925:free
    label: Scorer model
    description: OpenRouter decisions model; models can be delisted (rot) — pin or monitor.
  amos_model:
    type: str
    default: medium
    label: Amos model
    description: Keyless Amos systemone fallback model, used ONLY when amos_fallback is true (server may serve a smaller model — log the served id).
  amos_fallback:
    type: bool
    default: false
    label: Amos fallback lane
    description: Second opt-in for the keyless Amos/Scira systemone fallback on OpenRouter missing key/failure/timeout. Off by default — no second third-party service without an explicit yes.
  amos_base_url:
    type: str
    default: https://api.amos.scira.ai/v1/systemone
    label: Amos endpoint
    description: Amos systemone endpoint override (non-secret config; default listed).
