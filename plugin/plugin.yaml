name: turn-completion-nudge
version: "0.3.0"
description: "Nudges the agent to continue when a turn ends prematurely (planning or announcing next steps it has not done). Fail-open: never blocks a turn."
author: "ether-btc"
kind: standalone
requires_hermes: ">=0.21.3"
requires_env:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key for the configured scorer lane (OpenRouter decisions API, https://openrouter.ai/api/alpha/decisions). Optional — when unset or a template/placeholder value, the plugin fails open to the keyless Amos systemone fallback and no OpenRouter egress occurs."
    secret: true
optional_env:
  - name: HERMES_AMOS_BASE_URL
    description: "Amos-hosted systemone fallback endpoint (keyless, no API key required). Default: https://api.amos.scira.ai/v1/systemone"
provides_hooks:
  - post_llm_call
config_schema:
  enabled:
    type: bool
    default: true
    label: Enabled
    description: When false the post_llm_call hook no-ops (fail-open bypass).
  send_turn_text:
    type: bool
    default: false
    label: Send turn text for scoring
    description: Scoring sends ONLY the clipped user request (~1200 chars) and final assistant message (~1500 chars) to the chosen scorer endpoint; vendors may retain requests
  threshold:
    type: float
    default: 0.2
    label: Threshold
    description: Score below this value triggers a continuation nudge (0-1).
  timeout_s:
    type: int
    default: 4
    label: Timeout seconds
    description: Per-hop scorer timeout in seconds.
  scorer_model:
    type: str
    default: respan/span-01-lite-20260925:free
    label: Scorer model
    description: OpenRouter decisions model; models can be delisted (rot) — pin or monitor.
  amos_model:
    type: str
    default: medium
    label: Amos model
    description: Fallback systemone model (server may serve a smaller model — log the served id).
